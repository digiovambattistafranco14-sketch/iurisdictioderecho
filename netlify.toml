#  ═══════════════════════════════════════════════════════════════
#  Iurisdictio Derecho — configuración de Netlify
#
#  El sitio es estático: no hay backend, ni formularios, ni base de
#  datos, ni datos de usuarios. Así que el endurecimiento pasa por
#  las cabeceras HTTP y por no exponer archivos que no son del sitio.
#  ═══════════════════════════════════════════════════════════════

[build]
  # Sin comando de build: es HTML, CSS y JS servidos tal cual.
  publish = "."


#  ── Cabeceras de seguridad ──────────────────────────────────────
[[headers]]
  for = "/*"

  [headers.values]

    # Whitelist de lo único que el navegador puede cargar. Todo lo
    # demás queda bloqueado, así que si algún día alguien inyecta un
    # script o un iframe en el HTML, el navegador se niega a correrlo.
    #
    #   script-src 'self'      → solo js/main.js, nada externo ni inline
    #   style-src  ...         → CSS propio + la hoja de Google Fonts
    #   font-src   ...         → los .woff2 de Google Fonts
    #   img-src    'self' data: → imágenes propias + el favicon y la
    #                             textura de grano, que van embebidos
    #                             como data: URI dentro del CSS
    #   frame-ancestors 'none' → nadie puede meter el sitio en un iframe
    #   form-action 'none'     → no hay formularios: nada puede enviarse
    #   base-uri 'none'        → evita el secuestro de rutas relativas
    #
    # 'unsafe-inline' está solo en style-src, y es necesario: los
    # retardos de las animaciones viajan como atributos style="--d:…"
    # en el HTML. Es un permiso de estilos, no de scripts: no permite
    # ejecutar código. Si algún día se pasan esos retardos a clases de
    # CSS, se puede sacar y quedaría todavía más cerrado.
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; upgrade-insecure-requests"

    # Clickjacking: impide que el sitio se cargue dentro de un iframe
    # ajeno. Duplica a frame-ancestors, para navegadores viejos.
    X-Frame-Options = "DENY"

    # Impide que el navegador "adivine" el tipo de un archivo y termine
    # ejecutando como script algo que se sirvió como texto o imagen.
    X-Content-Type-Options = "nosniff"

    # Al salir del sitio (WhatsApp, Instagram) se manda solo el dominio,
    # nunca la URL completa ni la sección que la persona estaba leyendo.
    # En un estudio jurídico eso importa: nadie tiene por qué saber que
    # el visitante venía de la sección de derecho penal.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # El sitio no usa cámara, micrófono, ubicación ni pagos. Se los
    # negamos explícitamente, así ni siquiera puede pedirlos.
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()"

    # Aísla la pestaña: si el sitio abre otra ventana, esa ventana no
    # puede tocar la nuestra. Refuerza el rel="noopener" del HTML.
    Cross-Origin-Opener-Policy = "same-origin"

    # Obliga a HTTPS durante un año.
    #
    # A propósito SIN "includeSubDomains" ni "preload": ambos son muy
    # difíciles de revertir y el dominio definitivo todavía no está
    # configurado. Una vez que el dominio esté firme y se confirme que
    # todo subdominio va por HTTPS, se pueden agregar.
    Strict-Transport-Security = "max-age=31536000"


#  ── Documentación fuera del sitio público ───────────────────────
#  Estos archivos viven en el repo (sirven para mantener el sitio),
#  pero no son parte de la web. Sin estas reglas quedarían accesibles
#  en tudominio.com/README.md y tudominio.com/claude.md.

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/claude.md"
  to = "/index.html"
  status = 404
  force = true
